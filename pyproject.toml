[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "threadback"
version = "0.7.8"
description = "Pick up any project where you left off, with the next step you planned (Claude Code plugin)"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
threadback = "threadback.cli:main"

[tool.setuptools]
packages = ["threadback"]
